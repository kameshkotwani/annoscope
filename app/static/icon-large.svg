<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="box-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="box-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.04"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="36" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.8" fill="#7dd3fc"/>
    </pattern>
    <rect width="256" height="256" rx="36" fill="url(#dots)"/>
  </g>

  <!-- Central glow -->
  <circle cx="128" cy="128" r="90" fill="url(#glow-center)"/>

  <!-- Outer scope ring -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>

  <!-- Mid scope ring -->
  <circle cx="128" cy="128" r="72" fill="none" stroke="url(#ring2)" stroke-width="1" opacity="0.25" stroke-dasharray="4 6"/>

  <!-- Inner scope ring -->
  <circle cx="128" cy="128" r="55" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.35"/>

  <!-- Crosshair — top -->
  <line x1="128" y1="38" x2="128" y2="86" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- Crosshair — bottom -->
  <line x1="128" y1="170" x2="128" y2="218" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- Crosshair — left -->
  <line x1="38" y1="128" x2="86" y2="128" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- Crosshair — right -->
  <line x1="170" y1="128" x2="218" y2="128" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- Tick marks at 45deg diagonals on outer ring -->
  <line x1="192" y1="64" x2="186" y2="70" stroke="#3b82f6" stroke-width="1.2" opacity="0.4"/>
  <line x1="64" y1="64" x2="70" y2="70" stroke="#3b82f6" stroke-width="1.2" opacity="0.4"/>
  <line x1="192" y1="192" x2="186" y2="186" stroke="#3b82f6" stroke-width="1.2" opacity="0.4"/>
  <line x1="64" y1="192" x2="70" y2="186" stroke="#3b82f6" stroke-width="1.2" opacity="0.4"/>

  <!-- Main bounding box -->
  <rect x="82" y="96" width="92" height="60" rx="3"
        fill="url(#box-fill)"
        stroke="url(#box-stroke)" stroke-width="2"
        filter="url(#subtle-glow)"/>

  <!-- Corner handles — TL -->
  <rect x="78" y="92" width="10" height="10" rx="2" fill="#a855f7"/>
  <!-- Corner handles — TR -->
  <rect x="168" y="92" width="10" height="10" rx="2" fill="#a855f7"/>
  <!-- Corner handles — BL -->
  <rect x="78" y="154" width="10" height="10" rx="2" fill="#a855f7"/>
  <!-- Corner handles — BR -->
  <rect x="168" y="154" width="10" height="10" rx="2" fill="#a855f7"/>

  <!-- Mid-edge handles (smaller) -->
  <rect x="123" y="92" width="6" height="6" rx="1.5" fill="#7c3aed" opacity="0.7"/>
  <rect x="123" y="158" width="6" height="6" rx="1.5" fill="#7c3aed" opacity="0.7"/>
  <rect x="78" y="123" width="6" height="6" rx="1.5" fill="#7c3aed" opacity="0.7"/>
  <rect x="172" y="123" width="6" height="6" rx="1.5" fill="#7c3aed" opacity="0.7"/>

  <!-- Class label tag -->
  <rect x="82" y="81" width="48" height="16" rx="4" fill="#6366f1"/>
  <!-- label text simulacrum: 3 bars -->
  <rect x="88" y="86" width="10" height="3" rx="1" fill="#e0e7ff" opacity="0.9"/>
  <rect x="101" y="86" width="14" height="3" rx="1" fill="#e0e7ff" opacity="0.5"/>
  <rect x="118" y="86" width="6" height="3" rx="1" fill="#e0e7ff" opacity="0.3"/>

  <!-- Confidence badge -->
  <rect x="130" y="81" width="36" height="16" rx="4" fill="#0f766e" opacity="0.85"/>
  <rect x="136" y="86" width="8" height="3" rx="1" fill="#6ee7b7" opacity="0.9"/>
  <rect x="147" y="86" width="13" height="3" rx="1" fill="#6ee7b7" opacity="0.5"/>

  <!-- Center reticle dot -->
  <circle cx="128" cy="126" r="4" fill="url(#accent)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="128" cy="126" r="1.5" fill="#ffffff" opacity="0.9"/>

  <!-- Second (ghost) box — dimmed, slightly offset -->
  <rect x="100" y="110" width="58" height="36" rx="3"
        fill="none"
        stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.3"/>
  <!-- Ghost X mark -->
  <line x1="122" y1="122" x2="130" y2="130" stroke="#ef4444" stroke-width="1.2" opacity="0.35"/>
  <line x1="130" y1="122" x2="122" y2="130" stroke="#ef4444" stroke-width="1.2" opacity="0.35"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7f7"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="box-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Scope circle (outer ring) -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>

  <!-- Crosshair lines -->
  <!-- top gap -->
  <line x1="32" y1="11" x2="32" y2="19" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- bottom gap -->
  <line x1="32" y1="45" x2="32" y2="53" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- left gap -->
  <line x1="11" y1="32" x2="19" y2="32" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- right gap -->
  <line x1="45" y1="32" x2="53" y2="32" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bounding box (annotation rect) — inset, purple -->
  <rect x="21" y="22" width="22" height="16" rx="1.5"
        fill="rgba(99,102,241,0.08)"
        stroke="url(#box-stroke)" stroke-width="1.5"/>

  <!-- Corner handles (4 corners) -->
  <!-- TL -->
  <rect x="19.5" y="20.5" width="3.5" height="3.5" rx="0.75" fill="#a78bfa"/>
  <!-- TR -->
  <rect x="41" y="20.5" width="3.5" height="3.5" rx="0.75" fill="#a78bfa"/>
  <!-- BL -->
  <rect x="19.5" y="36" width="3.5" height="3.5" rx="0.75" fill="#a78bfa"/>
  <!-- BR -->
  <rect x="41" y="36" width="3.5" height="3.5" rx="0.75" fill="#a78bfa"/>

  <!-- Center dot -->
  <circle cx="32" cy="30" r="1.5" fill="url(#accent)" opacity="0.9"/>

  <!-- Class label tag -->
  <rect x="21" y="17" width="12" height="5" rx="1.5" fill="#6366f1" opacity="0.9"/>
  <rect x="22.5" y="18.5" width="4" height="2" rx="0.5" fill="#e0e7ff" opacity="0.8"/>
  <rect x="27.5" y="18.5" width="4" height="2" rx="0.5" fill="#e0e7ff" opacity="0.4"/>
</svg>

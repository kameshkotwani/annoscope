datasets:
  - name: Example Dataset
    slug: example_ds
    # Absolute or repo-relative path to the folder containing image files (.jpg/.png)
    images:  data/images/
    # Absolute or repo-relative path to the folder containing YOLO label files (.txt, one per image)
    labels:  data/labels/
    # Absolute or repo-relative path to the COCO annotations JSON file (null if unavailable)
    coco:    data/annotations.json
    classes:
      0: ClassA
      1: ClassB
